name: Formal model verification

on:
  push:

jobs:
  formal-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install pinned TLA+ tools
        run: |
          set -euo pipefail
          curl -fsSL -o "${RUNNER_TEMP}/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  ${RUNNER_TEMP}/tla2tools.jar" | sha256sum -c -
          echo "TLA2TOOLS_JAR=${RUNNER_TEMP}/tla2tools.jar" >> "$GITHUB_ENV"

      - name: Install checker test dependencies
        run: npm ci

      - name: Validate formal checker failure gates
        run: npx vitest run tests/formal-checker.test.ts tests/formal-bounded-body.test.ts tests/formal-embedding-worker.test.ts

      - name: Check bounded safety, liveness, reachability, candidates, and negative controls
        run: npm run test:formal
